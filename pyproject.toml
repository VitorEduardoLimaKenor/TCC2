[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tcc-rag-text2sql"
version = "0.1.0"
description = "Recuperação de demonstrações orientada à estrutura para Text-to-SQL em português brasileiro"
requires-python = ">=3.11,<3.13"
dependencies = [
    "sqlglot>=25.0",
    "qdrant-client>=1.9",
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
hf = ["torch>=2.2", "transformers>=4.44", "accelerate>=0.33"]
vllm = ["vllm>=0.6"]
dev = ["pytest>=8.0"]

[project.scripts]
tcc-rag = "tcc_rag.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
