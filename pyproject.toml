[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tcc-rag-text2sql"
version = "0.1.0"
description = "Recuperação de demonstrações orientada à estrutura para Text-to-SQL em português brasileiro"
# Sem teto superior de propósito: o Colab e o Kaggle atualizam a versão do
# Python sem aviso, e um teto aqui bloqueia a instalação no ambiente em que o
# experimento precisa rodar. O código é Python puro e não depende de nada
# específico de versão; a recomendação de 3.12 para desenvolvimento local, no
# README, é sobre disponibilidade de wheels, não sobre compatibilidade.
requires-python = ">=3.11"
dependencies = [
    # Pinado: a forma canonica que define as familias, e portanto a particao,
    # e produzida por este parser. Trocar de versao pode trocar o agrupamento.
    "sqlglot==30.17.0",
    "qdrant-client>=1.9",
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
hf = ["torch>=2.2", "transformers>=4.44", "accelerate>=0.33"]
vllm = ["vllm>=0.6"]
dev = ["pytest>=8.0"]

[project.scripts]
tcc-rag = "tcc_rag.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
